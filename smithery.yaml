# Smithery.ai MCP Server Configuration for GMPSignal 40-Actor Intelligence Suite
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apifyToken
    properties:
      apifyToken:
        type: string
        description: Your Apify API Token from https://console.apify.com/settings/integrations
      actors:
        type: string
        description: Comma-separated list of GMPSignal Apify Actor slugs to expose as MCP tools
        default: "gmpsignal/dex-token-scanner-security-auditor,gmpsignal/crypto-orderbook-arbitrage-scanner,gmpsignal/multichain-wallet-aml-risk-screener,gmpsignal/defi-yield-tvl-stablecoin-monitor,gmpsignal/prediction-markets-polymarket-kalshi-scanner,gmpsignal/b2b-company-techstack-contacts-enricher,gmpsignal/global-sanctions-pep-gleif-kyb-screener,gmpsignal/cyber-cve-kev-epss-vulnerability-scanner,gmpsignal/startup-vc-dealflow-yc-github-radar,gmpsignal/academic-patent-research-citation-intelligence,gmpsignal/shopify-global-store-products-scraper,gmpsignal/sec-edgar-filings,gmpsignal/fda-warning-letters-scraper,gmpsignal/eu-ted-tenders-scraper,gmpsignal/earthquake-monitor-usgs-emsc-afad"
  commandFunction:
    |-
    (config) => ({
      command: 'npx',
      args: [
        '-y',
        '@apify/actors-mcp-server',
        '--actors',
        config.actors || 'gmpsignal/dex-token-scanner-security-auditor,gmpsignal/crypto-orderbook-arbitrage-scanner,gmpsignal/multichain-wallet-aml-risk-screener,gmpsignal/defi-yield-tvl-stablecoin-monitor,gmpsignal/prediction-markets-polymarket-kalshi-scanner,gmpsignal/b2b-company-techstack-contacts-enricher,gmpsignal/global-sanctions-pep-gleif-kyb-screener,gmpsignal/cyber-cve-kev-epss-vulnerability-scanner,gmpsignal/startup-vc-dealflow-yc-github-radar,gmpsignal/academic-patent-research-citation-intelligence,gmpsignal/shopify-global-store-products-scraper'
      ],
      env: {
        APIFY_TOKEN: config.apifyToken
      }
    })
