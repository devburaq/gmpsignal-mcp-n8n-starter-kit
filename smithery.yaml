# Smithery.ai MCP Server Configuration for GMPSignal 40-Actor Intelligence Suite
build:
  dockerfile: Dockerfile
  dockerBuildPath: .
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      apifyToken:
        type: string
        description: Your Apify API Token from https://console.apify.com/settings/integrations (required for live tool execution; optional for tool discovery)
        default: ""
      suite:
        type: string
        description: GMPSignal Actor suite preset (flagship, crypto, b2b, compliance, regional, all)
        default: "all"
  commandFunction:
    |-
    (config) => ({
      command: 'node',
      args: [
        'packages/gmpsignal-mcp/bin/cli.mjs',
        '--suite',
        config.suite || 'all'
      ],
      env: {
        APIFY_TOKEN: config.apifyToken || ''
      }
    })
